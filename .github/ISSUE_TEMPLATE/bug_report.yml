name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check if the issue already exists in [open issues](https://github.com/wielorzeczownik/phalcon-inertia/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 'e.g. v0.1.0'
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: PHP and Phalcon versions
      placeholder: 'e.g. PHP 7.3.33, Phalcon 3.4.5'
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Inertia client adapter and version
      placeholder: 'e.g. @inertiajs/vue3 3.0.0'

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant error output or stack trace.
      render: text
