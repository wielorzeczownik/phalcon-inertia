name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=npm depName=prettier
  PRETTIER_VERSION: 3.9.10

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      js: ${{ steps.filter.outputs.js }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            php:
              - '.github/workflows/validate.yml'
              - 'src/**'
              - 'tests/**'
              - 'composer.json'
              - 'composer.lock'
              - 'pint.json'
              - 'phpunit.xml'
            matrix:
              - '.github/workflows/validate.yml'
              - 'src/**'
              - 'tests/**'
              - 'docker/**'
              - 'scripts/test-matrix.sh'
              - 'scripts/test-e2e.sh'
              - 'e2e/**'
              - 'js/dist/**'
            js:
              - '.github/workflows/validate.yml'
              - 'js/**'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.js'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**'
              - 'docker/*.sh'

      - name: Install shfmt and shellcheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shfmt --diff scripts/ docker/

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shellcheck scripts/*.sh docker/*.sh

      - name: Lint workflows
        if: ${{ !cancelled() && steps.filter.outputs.workflows == 'true' }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: ${{ env.ACTIONLINT_VERSION }}
          shellcheck: true

      - name: Format check
        if: ${{ !cancelled() && steps.filter.outputs.format == 'true' }}
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.filter.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  php:
    name: PHP
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.php == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Pint
        run: vendor/bin/pint --test

  js:
    name: JS
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        working-directory: js
        run: npm ci

      - name: Lint
        working-directory: js
        run: npm run lint

      - name: Typecheck
        working-directory: js
        run: npm run typecheck

      - name: Test
        working-directory: js
        run: npm test

      - name: Check that js/dist matches the source
        working-directory: js
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "js/dist is stale: run npm --prefix js run build and commit it"
            exit 1
          fi

  tests:
    name: Tests ${{ matrix.variant }}
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.matrix == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: php56-phalcon34
            php-image: php:5.6-cli@sha256:6ce95208609dc66df163ab936c970b3b34cd901b85c747102c5999f08ade9143
            phalcon: 3.4.5
            phpunit: 5.7.27
            e2e: true
          - variant: php73-phalcon34
            php-image: php:7.3-cli@sha256:bd6f2dc7a4e4537e927355c94a74c3022911aa504278f5f0fd94016c90dfaecc
            phalcon: 3.4.5
            phpunit: 9.6.38
          - variant: php74-phalcon41
            php-image: php:7.4-cli@sha256:620a6b9f4d4feef2210026172570465e9d0c1de79766418d3affd09190a7fda5
            phalcon: 4.1.2
            phpunit: 9.6.38
          - variant: php84-phalcon5
            php-image: php:8.4-cli@sha256:e2432ac85c3454004d89e3d75615abd2d205b7ffb9590e586fad1a053f016bb3
            phalcon: 5.23.0
            phpunit: 11.5.57
          - variant: php85-phalcon5
            php-image: php:8.5-cli@sha256:8e5d746f87655d89573e76d2b9125ed1b1578e47d3c466a2b2fdfc35593d9b41
            phalcon: 5.23.0
            phpunit: 11.5.57
            e2e: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          load: true
          tags: phalcon-inertia:${{ matrix.variant }}
          build-args: |
            PHP_IMAGE=${{ matrix.php-image }}
            PHALCON_VERSION=${{ matrix.phalcon }}
            PHPUNIT_VERSION=${{ matrix.phpunit }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: PHPUnit
        env:
          VARIANT: ${{ matrix.variant }}
        run: docker run --rm -v "$PWD:/app:ro" "phalcon-inertia:$VARIANT"

      - name: Playwright
        if: ${{ matrix.e2e }}
        env:
          VARIANT: ${{ matrix.variant }}
          SKIP_IMAGE_BUILD: '1'
        run: scripts/test-e2e.sh "$VARIANT"

      - name: Upload Playwright traces
        if: ${{ failure() && matrix.e2e }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.variant }}
          path: e2e/test-results
          retention-days: 7
